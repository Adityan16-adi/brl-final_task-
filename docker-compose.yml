services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: unified_learning_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: unified_learn
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Redis (Prepared for Socket.IO horizontal multi-instance pub/sub and caching)
  redis:
    image: redis:7.2-alpine
    container_name: unified_learning_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python ML & AI Service (FastAPI)
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: unified_learning_ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').getcode() == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Core Node.js / Express Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: unified_learning_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/unified_learn
      - ML_SERVICE_URL=http://ml_service:8001
      - JWT_SECRET=${JWT_SECRET:-smart-classroom-secure-jwt-secret-key-2026}
      - JWT_EXPIRES_IN=7d
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH}
    depends_on:
      mongo:
        condition: service_healthy
      ml_service:
        condition: service_started
    volumes:
      # Persistent volume for uploaded course assignments and files (fallback when Cloudinary is not set)
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
